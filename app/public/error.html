<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f7f7">
  <title>Akses · JohorStudio</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preload" href="/assets/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/styles.css?v=20261026">
</head>
<body class="public-page">
  <header class="public-header">
    <div class="wrap">
      <a class="brand" href="https://johorstudio.com" aria-label="JohorStudio.com">
        <img src="/assets/logo-dark.png" alt="JohorStudio.com" width="800" height="280">
      </a>
    </div>
  </header>
  <main class="public-main">
    <div class="wrap">
      <div class="public-card">
        <span class="public-code">{{CODE}} · ADMIN JOHORSTUDIO</span>
        <h1>{{TITLE}}</h1>
        <p>{{MESSAGE}}</p>
        <div class="public-actions">
          <a class="btn btn-primary" href="{{ACTION_URL}}">{{ACTION_LABEL}}</a>
          <a class="btn btn-line" href="https://johorstudio.com">johorstudio.com</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="public-footer">
    <div class="wrap">
      <span>© 2026 JohorStudio.com</span>
      <span>Dilindungi Cloudflare Access</span>
    </div>
  </footer>
</body>
</html>
